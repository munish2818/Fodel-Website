<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fodel Transport | Taxi & Transfers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--accent:#e11924;
--accent-hover:#b50f1b;
--page-bg:#f8fafc;
--text:#0f172a;
--border:rgba(15,23,42,0.15);
--radius:14px;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:"Poppins",sans-serif;
background:var(--page-bg);
color:var(--text);
}

.banner{
background:linear-gradient(140deg,#c8141d,#770c12);
color:white;
padding:70px 20px 60px;
text-align:center;
}

.topbar{
position:absolute;
top:20px;
left:0;
right:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.brand{
display:flex;
gap:10px;
align-items:center;
font-weight:700;
font-size:20px;
}

.brand-badge{
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#ffffff30;
}

.nav{
display:flex;
gap:8px;
align-items:center;
}

.pill-btn{
padding:6px 10px;
border-radius:10px;
font-size:14px;
font-weight:600;
color:white;
background:#111827;
}

.home-btn{
background:var(--accent);
}

.home-btn:hover{
background:var(--accent-hover);
}

.lang-select{
display:flex;
align-items:center;
gap:6px;
padding:6px 10px;
border-radius:10px;
background:#ffffff1a;
border:1px solid #ffffff40;
}

.lang-select select{
background:transparent;
border:none;
color:white;
font-weight:600;
cursor:pointer;
}

.hero h1{
font-size:40px;
margin-top:20px;
}

.hero p{
margin-top:10px;
opacity:0.9;
}

.section{
max-width:1000px;
margin:40px auto;
padding:0 16px;
}

.card{
background:white;
border-radius:16px;
padding:24px;
border:1px solid var(--border);
}

label{
display:block;
font-size:13px;
font-weight:600;
margin-bottom:6px;
}

input,select,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid var(--border);
font-family:"Poppins";
}

.row{
margin-bottom:14px;
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.btn{
background:var(--accent);
color:white;
border:none;
padding:12px 16px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.btn:hover{
background:var(--accent-hover);
}

.estimate{
margin-top:14px;
padding:12px;
border-radius:10px;
border:1px dashed #e11924;
}

.note{
font-size:12px;
color:#475569;
margin-top:8px;
}

.footer{
text-align:center;
margin:40px 0;
font-size:12px;
opacity:0.7;
}

</style>
</head>
<body>

<header class="banner">

<div class="topbar">

<div class="brand">
<div class="brand-badge">🚘</div>
Fodel Transport
</div>

<div class="nav">

<a class="pill-btn" href="reviews-travels.html">⭐ Reviews</a>
<a class="pill-btn home-btn" href="index.html">Home</a>

<div class="lang-select">
🌐
<select id="lang-picker">

<option value="en">English</option>
<option value="hi">हिंदी</option>
<option value="ur">اردو</option>
<option value="ta">தமிழ்</option>
<option value="kn">ಕನ್ನಡ</option>
<option value="te">తెలుగు</option>
<option value="bn">বাংলা</option>
<option value="mr">मराठी</option>
<option value="gu">ગુજરાતી</option>
<option value="ml">മലയാളം</option>
<option value="pa">ਪੰਜਾਬੀ</option>
<option value="or">ଓଡ଼ିଆ</option>
<option value="as">অসমীয়া</option>

</select>
</div>

</div>
</div>

<div class="hero">
<h1>Taxi · Transfers · Tours</h1>
<p>Jammu · Katra · Patnitop · Srinagar</p>
</div>

</header>


<section class="section">

<div class="card">

<h2>Transport Requirement</h2>

<div class="grid-2">

<div class="row">
<label>Pickup location</label>
<input id="pickup" placeholder="Pickup location">
</div>

<div class="row">
<label>Drop location</label>
<input id="drop" placeholder="Drop location">
</div>

</div>

<div class="grid-2">

<div class="row">
<label>Pickup date</label>
<input type="date" id="date">
</div>

<div class="row">
<label>Pickup time</label>
<input type="time" id="time">
</div>

</div>

<div class="grid-2">

<div class="row">
<label>Vehicle type</label>
<select id="vehicle">

<option>Sedan (Dzire/Amaze)</option>
<option>SUV (Ertiga)</option>
<option>Innova / Crysta</option>
<option>Tempo Traveller</option>

</select>
</div>

<div class="row">
<label>Total passengers</label>
<input id="pax" type="number" min="1">
</div>

</div>

<div class="grid-2">

<div class="row">
<label>How many cars</label>
<input id="cars" type="number" value="1">
</div>

<div class="row">
<label>Add-ons</label>

<select id="addons">
<option>None</option>
<option>Roof carrier</option>
<option>Placard</option>
</select>

</div>

</div>

<div class="estimate">

<strong>Estimate:</strong>
<span id="est">₹ —</span>

</div>

<div class="grid-2">

<div class="row">
<label>Your name</label>
<input id="name">
</div>

<div class="row">
<label>Mobile</label>
<input id="mobile">
</div>

</div>

<div class="row">
<label>Email</label>
<input id="email">
</div>

<div class="row">
<label>Prefer contact on</label>
<select id="pref">

<option>WhatsApp</option>
<option>Email</option>

</select>
</div>

<button class="btn" id="submit">Submit Transport Request</button>

<p class="note">
Estimate is indicative for planning. Final fare may vary depending on kms,
waiting, tolls, parking, and vehicle type.
</p>

</div>

</section>

<footer class="footer">
© Fodel Transport
</footer>
<script>

function buildTrip(){

const pickup=document.getElementById("pickup").value;
const drop=document.getElementById("drop").value;

const date=document.getElementById("date").value;
const time=document.getElementById("time").value;

const vehicle=document.getElementById("vehicle").value;

const pax=document.getElementById("pax").value;
const cars=document.getElementById("cars").value;

const addons=document.getElementById("addons").value;

const name=document.getElementById("name").value;
const mobile=document.getElementById("mobile").value;
const email=document.getElementById("email").value;

return `🚘 *NEW TRANSPORT REQUEST*

*Route:* ${pickup} → ${drop}

*Pickup:* ${date} ${time}

*Vehicle:* ${vehicle}

*Passengers:* ${pax}
*Cars:* ${cars}

*Add-ons:* ${addons}

━━━━━━━━━━

*Guest Details*

Name: ${name}
Mobile: ${mobile}
Email: ${email}

━━━━━━━━━━

*NOTE*

Estimate is indicative for planning.
Final fare may vary depending on
distance, waiting, tolls, parking,
night charges and vehicle type.

We will confirm the best price before booking.
`;

}

document.getElementById("submit").onclick=function(){

const text=buildTrip();

const pref=document.getElementById("pref").value;

if(pref==="WhatsApp"){

window.open(
"https://wa.me/919797459260?text="+encodeURIComponent(text)
);

}

else{

window.location.href=
"mailto:sales@fodeltravels.in?subject=Fodel Transport — New Request&body="+encodeURIComponent(text);

}

};

</script>

</body>
</html>
