<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fodel Transport Booking</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_API_KEY&libraries=places"></script>

<style>

body{
font-family:Poppins;
background:#f3f6fb;
margin:0;
}

.banner{
min-height:30vh;
background:linear-gradient(140deg,#c8141d,#770c12);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.banner h1{
font-size:30px;
margin:0;
}

.container{
width:min(950px,92%);
margin:auto;
margin-top:-40px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 14px 40px rgba(0,0,0,0.15);
}

.row{
margin-bottom:14px;
}

label{
font-weight:600;
font-size:13px;
}

input,select{
width:100%;
padding:11px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
}

button{
background:#e11924;
border:0;
color:white;
padding:12px 16px;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#b50f1b;
}

.addons{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.chip{
border:1px solid #ddd;
border-radius:20px;
padding:6px 10px;
font-size:13px;
display:flex;
align-items:center;
gap:6px;
}

.estimate{
margin-top:10px;
background:#f7f9fc;
padding:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
}

.driverBox{
margin-top:12px;
font-size:13px;
background:#eef2f8;
padding:8px;
border-radius:8px;
}

@media(max-width:600px){

.banner{
min-height:22vh;
}

.banner h1{
font-size:22px;
}

}

</style>

</head>

<body>

<div class="banner">
<h1>Taxi • Airport Transfers • Tours</h1>
</div>

<div class="container">

<div class="card">

<h2>Transport Booking</h2>

<div class="row">

<label>Trip Type</label>

<select id="tripType">
<option value="oneway">One Way</option>
<option value="round">Round Trip</option>
<option value="multi">Multi City</option>
<option value="local">Local</option>
</select>

</div>

<div class="row">

<label>Pickup Location</label>
<input id="pickup">

</div>

<div class="row">

<label>Drop Location</label>
<input id="drop">

</div>

<div class="row">

<label>Date</label>
<input type="date" id="date">

</div>

<div class="row">

<label>Pickup Time</label>
<input type="time" id="time">

</div>

<div id="transportFields" style="display:none">

<div class="row">

<label>Flight Number</label>
<input id="flight">

</div>

<div class="row">

<label>Train Number</label>
<input id="train">

</div>

</div>

<div class="row">

<label>Vehicle</label>

<select id="vehicle">

<option value="sedan">Sedan</option>
<option value="suv">SUV</option>
<option value="innova">Innova</option>
<option value="traveller">Traveller</option>

</select>

</div>

<div class="row">

<label>Add-ons</label>

<div class="addons">

<label class="chip">
<input type="checkbox" value="roof"> Roof Carrier
</label>

<label class="chip">
<input type="checkbox" value="placard"> Meet & Greet Placard
</label>

</div>

</div>

<div class="estimate">

<span id="distance">Distance: --</span>
<span id="price">Estimate: --</span>

</div>

<div class="driverBox" id="driverBox">
Driver assignment: pending
</div>

<br>

<button id="submitBtn">Submit Transport Request</button>

</div>

</div>
  <script>

/* ========================
AIRPORT / RAILWAY DETECTION
======================== */

function isAirport(v){
return /airport/i.test(v)
}

function isRailway(v){
return /(railway|station|tawi)/i.test(v)
}

const pickup=document.getElementById("pickup")
const drop=document.getElementById("drop")

const flight=document.getElementById("flight")
const train=document.getElementById("train")

const transportFields=document.getElementById("transportFields")

function updateTransportFields(){

const p=pickup.value

if(isAirport(p)){

transportFields.style.display="block"
flight.parentElement.style.display="block"
train.parentElement.style.display="none"

}

else if(isRailway(p)){

transportFields.style.display="block"
train.parentElement.style.display="block"
flight.parentElement.style.display="none"

}

else{

transportFields.style.display="none"

}

}

pickup.addEventListener("input",updateTransportFields)


/* ========================
GOOGLE MAPS AUTOCOMPLETE
======================== */

const pickupAuto=new google.maps.places.Autocomplete(pickup)
const dropAuto=new google.maps.places.Autocomplete(drop)


/* ========================
DISTANCE CALCULATOR
======================== */

async function calculateDistance(){

const service=new google.maps.DistanceMatrixService()

service.getDistanceMatrix({

origins:[pickup.value],
destinations:[drop.value],
travelMode:"DRIVING"

},function(res,status){

if(status!=="OK") return

const km=res.rows[0].elements[0].distance.value/1000

document.getElementById("distance").innerText=
"Distance: "+km.toFixed(1)+" km"

calculatePrice(km)

})

}


/* ========================
PRICE ENGINE
======================== */

function calculatePrice(km){

let base=0

const v=document.getElementById("vehicle").value

if(v==="sedan") base=14
if(v==="suv") base=18
if(v==="innova") base=22
if(v==="traveller") base=28

let price=km*base

const addons=[...document.querySelectorAll(".addons input:checked")]

addons.forEach(a=>{

if(a.value==="roof") price+=200
if(a.value==="placard") price+=100

})

document.getElementById("price").innerText=
"Estimate: ₹"+Math.round(price)

}

/* auto distance trigger */

pickup.addEventListener("change",calculateDistance)
drop.addEventListener("change",calculateDistance)


/* ========================
VEHICLE AVAILABILITY
======================== */

const vehicleStock={
sedan:5,
suv:3,
innova:2,
traveller:1
}

document.getElementById("vehicle").addEventListener("change",function(){

const v=this.value

if(vehicleStock[v]<=0){

alert("Vehicle not available")

}

})


/* ========================
DRIVER ASSIGNMENT
======================== */

const drivers=[

{name:"Ramesh",vehicle:"sedan"},
{name:"Imran",vehicle:"suv"},
{name:"Amit",vehicle:"innova"},
{name:"Karan",vehicle:"traveller"}

]

function assignDriver(){

const v=document.getElementById("vehicle").value

const driver=drivers.find(d=>d.vehicle===v)

if(driver){

document.getElementById("driverBox").innerText=
"Driver assigned: "+driver.name

}else{

document.getElementById("driverBox").innerText=
"Driver assignment pending"

}

}

document.getElementById("vehicle").addEventListener("change",assignDriver)


/* ========================
SUBMIT REQUEST
======================== */

document.getElementById("submitBtn").addEventListener("click",function(){

const name="Customer"

const msg=
`Transport Request

Pickup: ${pickup.value}
Drop: ${drop.value}
Date: ${document.getElementById("date").value}
Time: ${document.getElementById("time").value}

Vehicle: ${document.getElementById("vehicle").value}

Flight: ${flight.value||"-"}
Train: ${train.value||"-"}

`

const url=
"https://wa.me/919797459260?text="+encodeURIComponent(msg)

window.open(url,"_blank")

})

</script>
