<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fodel Transport | Taxi & Transfers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--accent:#e11924;
--accent-hover:#b50f1b;
--banner-deep:#770c12;
--banner-mid:#a31018;
--banner-top:#c8141d;
--border:rgba(15,23,42,0.15);
--radius:16px;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:"Poppins",sans-serif;
background:#f8fafc;
color:#0f172a;
}

.banner{
background:
linear-gradient(160deg,var(--banner-top),var(--banner-mid),var(--banner-deep));
color:white;
min-height:42vh;
display:grid;
place-items:center;
text-align:center;
position:relative;
}

.banner-inner{
width:min(1100px,92%);
margin:auto;
padding:30px;
}

.hero h1{
font-size:clamp(28px,5vw,46px);
font-weight:700;
}

.hero p{
margin-top:10px;
opacity:0.9;
}

.topbar{
position:absolute;
top:20px;
left:0;
right:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.brand{
display:flex;
gap:10px;
align-items:center;
font-weight:700;
font-size:20px;
}

.brand-badge{
width:34px;
height:34px;
border-radius:50%;
display:grid;
place-items:center;
background:#ffffff1a;
border:1px solid #ffffff40;
}

.nav{
display:flex;
gap:8px;
align-items:center;
}

.pill-btn{
padding:6px 12px;
border-radius:10px;
font-weight:600;
font-size:14px;
background:#111827;
color:white;
}

.home-btn{
background:var(--accent);
}

.home-btn:hover{
background:var(--accent-hover);
}

.lang-select{
display:inline-flex;
align-items:center;
gap:6px;
padding:6px 10px;
border-radius:10px;
background:#ffffff1a;
border:1px solid #ffffff40;
font-weight:700;
height:32px;
}

.lang-select select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background:transparent;
border:none;
color:white;
font:inherit;
font-weight:700;
cursor:pointer;
padding-right:16px;
}

.lang-select select option{
color:black;
background:white;
}

.section{
width:min(1100px,92%);
margin:30px auto 70px;
}

.card{
background:white;
border-radius:16px;
padding:22px;
border:1px solid var(--border);
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.row{
margin-bottom:12px;
}

label{
display:block;
font-size:13px;
font-weight:600;
margin-bottom:6px;
}

input,select,textarea{
width:100%;
padding:11px;
border-radius:10px;
border:1px solid var(--border);
font-family:"Poppins";
}

.btn{
padding:12px 16px;
border-radius:12px;
background:var(--accent);
color:white;
font-weight:700;
border:none;
cursor:pointer;
}

.btn:hover{
background:var(--accent-hover);
}

.estimate{
margin-top:12px;
padding:12px;
border-radius:12px;
border:1px dashed var(--accent);
}

.note{
font-size:12px;
color:#475569;
margin-top:8px;
}

.footer{
text-align:center;
margin:30px 0;
font-size:12px;
opacity:0.7;
}

</style>
