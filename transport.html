<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fodel Transport Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--accent:#e11924;
--accent-hover:#b50f1b;
--bg:#f5f7fb;
--card:#ffffff;
--border:#e2e8f0;
--radius:16px;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Poppins;
background:var(--bg);
color:#0f172a;
}

/* HERO */

.hero{
background:linear-gradient(150deg,#c8141d,#770c12);
color:white;
padding:70px 20px;
text-align:center;
}

.hero h1{
font-size:38px;
margin-bottom:8px;
}

.hero p{
opacity:.9;
}

/* CONTAINER */

.container{
width:min(1100px,92%);
margin:auto;
margin-top:-50px;
}

/* CARD */

.card{
background:var(--card);
border-radius:var(--radius);
box-shadow:0 20px 60px rgba(0,0,0,0.2);
padding:24px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

@media(min-width:700px){

.grid-2{
grid-template-columns:1fr 1fr;
}

}

/* INPUTS */

label{
font-size:13px;
font-weight:600;
margin-bottom:4px;
display:block;
}

input,select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid var(--border);
font-size:14px;
}

/* ADDONS */

.addons{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.chip{
border:1px solid var(--border);
border-radius:999px;
padding:6px 10px;
display:flex;
gap:6px;
font-size:13px;
}

/* BUTTON */

.btn{
background:var(--accent);
color:white;
border:0;
padding:14px 18px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.btn:hover{
background:var(--accent-hover);
}

/* ESTIMATE */

.estimate{
margin-top:14px;
border:1px dashed var(--accent);
border-radius:12px;
padding:12px;
display:flex;
justify-content:space-between;
}

/* MOBILE */

@media(max-width:600px){

.hero{
padding:50px 10px;
}

.hero h1{
font-size:26px;
}

}

</style>

</head>

<body>

<section class="hero">

<h1>Taxi · Airport Transfers · Tours</h1>
<p>Jammu · Katra · Patnitop · Srinagar</p>

</section>

<section class="container">

<div class="card">

<h2>Book Your Transport</h2>

<br>

<div class="grid grid-2">

<div>
<label>Pickup Location</label>
<input id="pickup">
</div>

<div>
<label>Drop Location</label>
<input id="drop">
</div>

</div>

<div class="grid grid-2">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Pickup Time</label>
<input type="time" id="time">
</div>

</div>

<div id="transportFields" style="display:none">

<br>

<div class="grid grid-2">

<div>
<label>Flight Number</label>
<input id="flight">
</div>

<div>
<label>Train Number</label>
<input id="train">
</div>

</div>

</div>

<br>

<label>Vehicle</label>

<select id="vehicle">

<option value="sedan">Sedan</option>
<option value="suv">SUV</option>
<option value="innova">Innova</option>
<option value="traveller">Traveller</option>

</select>

<br><br>

<label>Add-ons</label>

<div class="addons">

<label class="chip">
<input type="checkbox" value="roof"> Roof Carrier
</label>

<label class="chip">
<input type="checkbox" value="placard"> Meet & Greet Placard
</label>

</div>

<div class="estimate">

<span id="distance">Distance: --</span>
<span id="price">Estimate: --</span>

</div>

<br>

<button class="btn" id="submitBtn">Submit Transport Request</button>

</div>

</section>
<script>

/* AIRPORT / RAILWAY DETECTION */

function isAirport(v){
return /airport/i.test(v)
}

function isRailway(v){
return /(railway|station|tawi)/i.test(v)
}

const pickup=document.getElementById("pickup")
const drop=document.getElementById("drop")

const flight=document.getElementById("flight")
const train=document.getElementById("train")

const transportFields=document.getElementById("transportFields")

function updateTransportFields(){

if(isAirport(pickup.value)){

transportFields.style.display="block"
flight.parentElement.style.display="block"
train.parentElement.style.display="none"

}

else if(isRailway(pickup.value)){

transportFields.style.display="block"
train.parentElement.style.display="block"
flight.parentElement.style.display="none"

}

else{

transportFields.style.display="none"

}

}

pickup.addEventListener("input",updateTransportFields)

/* DISTANCE MOCK */

function calculateDistance(){

if(!pickup.value || !drop.value) return

const km=Math.floor(Math.random()*120)+20

document.getElementById("distance").innerText=
"Distance: "+km+" km"

calculatePrice(km)

}

/* PRICE ENGINE */

function calculatePrice(km){

let rate=14

const v=document.getElementById("vehicle").value

if(v==="suv") rate=18
if(v==="innova") rate=22
if(v==="traveller") rate=28

let price=km*rate

document.querySelectorAll(".addons input:checked").forEach(a=>{

if(a.value==="roof") price+=200
if(a.value==="placard") price+=100

})

document.getElementById("price").innerText=
"Estimate: ₹"+price

}

pickup.addEventListener("change",calculateDistance)
drop.addEventListener("change",calculateDistance)

/* SUBMIT */

document.getElementById("submitBtn").addEventListener("click",function(){

const msg=

`Transport Request

Pickup: ${pickup.value}
Drop: ${drop.value}

Date: ${document.getElementById("date").value}
Time: ${document.getElementById("time").value}

Vehicle: ${document.getElementById("vehicle").value}

Flight: ${flight.value||"-"}
Train: ${train.value||"-"}

`

const url="https://wa.me/919797459260?text="+encodeURIComponent(msg)

window.open(url)

})

</script>

</body>
</html>
