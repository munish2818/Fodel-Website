<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fodel Transport</title>

<style>

body{
font-family:Poppins,Arial;
background:#f7f8fb;
margin:0;
}

.banner{
background:#e11924;
color:white;
padding:40px;
text-align:center;
}

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

label{
font-weight:600;
font-size:13px;
}

input,select,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

textarea{
min-height:80px;
}

.chip{
display:inline-flex;
align-items:center;
gap:6px;
background:#f1f5f9;
padding:6px 10px;
border-radius:20px;
margin-right:8px;
}

.btn{
background:#e11924;
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.estimate{
border:1px dashed #ccc;
padding:12px;
border-radius:10px;
display:flex;
justify-content:space-between;
margin-top:10px;
}

</style>

</head>

<body>

<header class="banner">

<h1>Taxi · Transfers · Multi-City Tours</h1>
<p>Jammu · Katra · Patnitop · Srinagar</p>

</header>

<section class="section">

<div class="card">

<h2>Transport Requirement</h2>

<div class="grid-2">

<div>

<label>Pickup</label>
<select id="pickup">
<option value="">Select</option>
<option>Jammu Airport</option>
<option>Jammu Tawi Railway Station</option>
<option>Jammu City</option>
<option>Katra</option>
<option>Patnitop</option>
<option>Srinagar Airport</option>
<option>Srinagar City</option>
</select>

</div>

<div>

<label>Drop</label>
<select id="drop">
<option value="">Select</option>
<option>Jammu Airport</option>
<option>Jammu Tawi Railway Station</option>
<option>Jammu City</option>
<option>Katra</option>
<option>Patnitop</option>
<option>Srinagar Airport</option>
<option>Srinagar City</option>
</select>

</div>

</div>

<div class="grid-2">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Time</label>
<input type="time" id="time">
</div>

</div>
<div id="block-ft" style="display:none; margin-top:15px;">

<div class="grid-2">

<div id="flight-row">

<label>Flight Number</label>
<input id="flight" placeholder="AI-821">

</div>

<div id="train-row">

<label>Train Number</label>
<input id="train" placeholder="12426">

</div>

</div>

<div style="margin-top:10px">

<label>Meet & Greet</label>

<select id="meet">
<option value="">No</option>
<option value="placard">Placard (+₹100)</option>
</select>

</div>

</div>

<hr style="margin:20px 0">

<div class="grid-2">

<div>

<label>Vehicle</label>

<select id="vehicle">
<option value="">Select</option>
<option value="sedan">Sedan</option>
<option value="suv">SUV</option>
<option value="innova">Innova</option>
<option value="tt">Tempo Traveller</option>
</select>

</div>

<div>

<label>Cars</label>
<input type="number" id="cars" value="1" min="1">

</div>

</div>

<div class="grid-2">

<div>

<label>Passengers</label>
<input id="pax" type="number">

</div>

<div>

<label>Add-ons</label>

<div>

<label class="chip">
<input type="checkbox" class="addon" value="roofcarrier">
Roof Carrier (+₹200)
</label>

</div>

</div>

</div>

<div style="margin-top:10px">

<label>Additional Remarks</label>
<textarea id="notes"></textarea>

</div>

<div class="estimate">

<div>
<strong>Estimate:</strong>
<span id="est-text">Select route</span>
</div>

<div>
KM:
<span id="km-text">—</span>
</div>

</div>

<hr>

<div class="grid-2">

<div>
<label>Name</label>
<input id="name">
</div>

<div>
<label>Mobile</label>
<input id="mobile">
</div>

</div>

<label>Email</label>
<input id="email">

<label>Prefer contact</label>

<select id="pref-contact">
<option>WhatsApp</option>
<option>Email</option>
<option>Call</option>
</select>

<br><br>

<button class="btn" id="submit-btn">
Submit Transport Request
</button>

</div>

</section>
<script>

const ADDONS={
roofcarrier:200,
placard:100
};

let ROUTES=[
{from:"Jammu Airport",to:"Katra",sedan:1900,suv:2400,innova:3000,tt:4800,km:50},
{from:"Katra",to:"Patnitop",sedan:2100,suv:2600,innova:3200,tt:5000,km:80},
{from:"Srinagar Airport",to:"Gulmarg",sedan:2200,suv:2700,innova:3400,tt:5200,km:55}
];

function detectHub(text){

if(!text)return"";

text=text.toLowerCase();

if(text.includes("airport"))return"airport";

if(text.includes("railway")||text.includes("station")||text.includes("tawi"))
return"railway";

return"";

}

function updateTransportFields(){

const pickup=document.getElementById("pickup").value;
const drop=document.getElementById("drop").value;

const hub=detectHub(pickup)||detectHub(drop);

const block=document.getElementById("block-ft");

const flight=document.getElementById("flight-row");
const train=document.getElementById("train-row");

if(!hub){
block.style.display="none";
return;
}

block.style.display="";

if(hub==="airport"){
flight.style.display="";
train.style.display="none";
}

if(hub==="railway"){
train.style.display="";
flight.style.display="none";
}

}

function findRoute(a,b){

return ROUTES.find(r=>r.from===a&&r.to===b);

}

function calculate(){

const pickup=document.getElementById("pickup").value;
const drop=document.getElementById("drop").value;

const vehicle=document.getElementById("vehicle").value;
const cars=parseInt(document.getElementById("cars").value||1);

const est=document.getElementById("est-text");
const km=document.getElementById("km-text");

if(!pickup||!drop){
est.textContent="Select route";
km.textContent="—";
return;
}

const route=findRoute(pickup,drop);

if(!route){
est.textContent="Ask for quote";
km.textContent="—";
return;
}

let price=route[vehicle]||0;

let addon=0;

const roof=document.querySelector(".addon").checked;

const placard=document.getElementById("meet").value==="placard";

if(roof)addon+=ADDONS.roofcarrier;

if(placard)addon+=ADDONS.placard;

price=(price+addon)*cars;

est.textContent="₹ "+price.toLocaleString("en-IN");
km.textContent=route.km+" km";

}

function submitForm(){

const pickup=document.getElementById("pickup").value;
const drop=document.getElementById("drop").value;

const name=document.getElementById("name").value;
const mobile=document.getElementById("mobile").value;

let msg=`Transport Request

Name: ${name}
Mobile: ${mobile}

Route:
${pickup} → ${drop}`;

const pref=document.getElementById("pref-contact").value;

if(pref==="Email"){

location.href="mailto:sales@fodeltravels.in?subject=Transport&body="+encodeURIComponent(msg);

}else{

location.href="https://wa.me/919797459260?text="+encodeURIComponent(msg);

}

}

document.querySelectorAll("#pickup,#drop")
.forEach(el=>el.addEventListener("change",updateTransportFields));

document.querySelectorAll("#pickup,#drop,#vehicle,#cars,#meet,.addon")
.forEach(el=>el.addEventListener("change",calculate));

document.getElementById("submit-btn")
.addEventListener("click",submitForm);

</script>

</body>
</html>
