<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fodel India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#facc15;
color:#111827;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
padding:20px;
}

.container{
max-width:600px;
width:100%;
}

h1{
font-size:36px;
margin-bottom:10px;
}

.subtitle{
font-size:14px;
margin-bottom:50px;
opacity:0.8;
}

.buttons{
display:flex;
flex-direction:column;
gap:20px;
}

.btn{
padding:18px;
font-size:18px;
border-radius:10px;
font-weight:600;
text-decoration:none;
display:block;
transition:0.25s;
}

/* Systems Button */

.systems{
background:#2563eb;
color:white;
}

.systems:hover{
background:#1d4ed8;
}

/* Travel Button */

.travel{
background:#0f766e;
color:white;
}

.travel:hover{
background:#115e59;
}

@media(min-width:700px){

.buttons{
flex-direction:row;
}

.btn{
flex:1;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Fodel India</h1>

<div class="subtitle">
Future Oriented Digital Enterprises & Logistics
</div>

<div class="buttons">

<a href="systems.html" class="btn systems">
Fodel Systems
</a>

<a href="travel.html" class="btn travel">
Fodel Travels
</a>

</div>

</div>

</body>
</html>
