<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fodel India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
height:100vh;
background:linear-gradient(135deg,#1e3a8a,#9333ea);
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden;
}

/* main container */

.container{
width:100%;
max-width:1200px;
padding:40px;
text-align:center;
}

h1{
font-size:42px;
margin-bottom:60px;
font-weight:600;
}

/* split layout */

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

/* cards */

.card{
padding:50px;
border-radius:20px;
cursor:pointer;
transition:0.4s;
text-align:center;
backdrop-filter:blur(10px);
}

/* systems card */

.systems{
background:linear-gradient(135deg,#2563eb,#1e40af);
}

/* travel card */

.travel{
background:linear-gradient(135deg,#9333ea,#7c3aed);
}

.card:hover{
transform:translateY(-12px) scale(1.03);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

.card h2{
font-size:28px;
margin-top:20px;
margin-bottom:10px;
}

.card p{
opacity:0.9;
font-size:15px;
}

/* icon */

.icon{
font-size:50px;
}

/* links */

a{
text-decoration:none;
color:white;
}

/* mobile */

@media(max-width:768px){

.options{
grid-template-columns:1fr;
}

h1{
font-size:32px;
margin-bottom:40px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Welcome to Fodel India</h1>

<div class="options">

<a href="systems.html">

<div class="card systems">

<div class="icon">📟</div>

<h2>Fodel Systems</h2>

<p>
Wireless waiter calling systems for restaurants, cafés and lounges.
</p>

</div>

</a>


<a href="travel.html">

<div class="card travel">

<div class="icon">✈️</div>

<h2>Fodel Travels</h2>

<p>
Hotel bookings, destination weddings, group travel and corporate MICE services.
</p>

</div>

</a>

</div>

</div>

</body>

</html>
