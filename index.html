<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fodel India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(145deg,#020617,#0f172a);
color:white;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:100%;
max-width:1100px;
padding:40px;
text-align:center;
}

/* Header */

.brand{
margin-bottom:70px;
}

.brand h1{
font-size:42px;
font-weight:600;
letter-spacing:-1px;
}

.brand p{
opacity:0.7;
margin-top:10px;
font-size:14px;
}

/* Grid */

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

/* Cards */

.card{
padding:60px 40px;
border-radius:16px;
background:#111827;
border:1px solid rgba(255,255,255,0.08);
transition:0.35s;
cursor:pointer;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

/* Systems Theme */

.systems{
border-left:6px solid #2563eb;
}

.systems:hover{
background:#0b2447;
}

/* Travel Theme */

.travel{
border-left:6px solid #14b8a6;
}

.travel:hover{
background:#083344;
}

/* Icons */

.icon{
font-size:48px;
margin-bottom:20px;
}

/* Text */

.card h2{
font-size:26px;
margin-bottom:10px;
}

.card p{
font-size:15px;
opacity:0.8;
line-height:1.6;
}

a{
text-decoration:none;
color:white;
}

/* Mobile */

@media(max-width:768px){

.options{
grid-template-columns:1fr;
}

.brand h1{
font-size:30px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="brand">

<h1>Fodel India</h1>

<p>Future Oriented Digital Enterprises & Logistics</p>

</div>

<div class="options">

<a href="systems.html">

<div class="card systems">

<div class="icon">📟</div>

<h2>Fodel Systems</h2>

<p>
Wireless waiter calling systems for restaurants, cafés and lounges.
</p>

</div>

</a>


<a href="travel.html">

<div class="card travel">

<div class="icon">✈️</div>

<h2>Fodel Travels</h2>

<p>
Hotel bookings, destination weddings, group travel and corporate MICE services.
</p>

</div>

</a>

</div>

</div>

</body>
</html>
