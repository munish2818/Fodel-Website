<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fodel India</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Inter', sans-serif;
        background:#ffffff;
        color:#1f2937;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .wrap{
        max-width:650px;
        width:100%;
        background:#f9fafb;
        padding:40px 35px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.07);
        text-align:center;
        border:1px solid #e5e7eb;
    }

    h1{
        font-size:34px;
        font-weight:700;
        margin-bottom:10px;
        color:#111827;
    }

    .tagline{
        font-size:15px;
        margin-bottom:40px;
        opacity:0.7;
    }

    .button-box{
        display:flex;
        flex-direction:column;
        gap:15px;
        margin-top:20px;
    }

    .btn{
        padding:16px;
        font-size:17px;
        font-weight:600;
        text-decoration:none;
        border-radius:10px;
        transition:0.25s;
        display:block;
    }

    .btn-sys{
        background:#2563eb;
        color:#fff;
    }
    .btn-sys:hover{
        background:#1e3fa8;
    }

    .btn-travel{
        background:#059669;
        color:#fff;
    }
    .btn-travel:hover{
        background:#047857;
    }

    @media (min-width:700px){
        .button-box{
            flex-direction:row;
        }
        .btn{
            flex:1;
        }
    }
</style>
</head>

<body>
<div class="wrap">
    <h1>Fodel India</h1>
    <p class="tagline">Future Oriented Digital Enterprises & Logistics</p>

    <div class="button-box">
        <a href="systems.html" class="btn btn-sys">Fodel Systems</a>
        <a href="travel.html" class="btn btn-travel">Fodel Travels</a>
    </div>
</div>
</body>
</html>
