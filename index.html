<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fodel India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#facc15;
color:#111827;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
padding:20px;
}

/* container */

.container{
max-width:650px;
width:100%;
}

/* brand */

.brand{
font-size:40px;
font-weight:600;
margin-bottom:6px;
}

.tagline{
font-size:14px;
opacity:0.8;
margin-bottom:40px;
}

/* section title */

.choose{
font-weight:500;
margin-bottom:30px;
font-size:18px;
}

/* cards */

.services{
display:flex;
flex-direction:column;
gap:25px;
}

/* buttons */

.btn{
display:block;
padding:18px;
border-radius:10px;
font-size:20px;
font-weight:600;
text-decoration:none;
transition:0.25s;
}

/* systems */

.systems{
background:#2563eb;
color:white;
}

.systems:hover{
background:#1d4ed8;
transform:translateY(-2px);
}

/* travel */

.travel{
background:#0f766e;
color:white;
}

.travel:hover{
background:#115e59;
transform:translateY(-2px);
}

/* descriptions */

.service-text{
font-size:14px;
opacity:0.8;
margin-top:6px;
}

/* footer */

.footer{
position:absolute;
bottom:20px;
font-size:13px;
display:flex;
gap:20px;
}

/* footer links */

.footer a{
text-decoration:none;
color:#111827;
transition:0.25s;
}

.footer a:hover{
color:#000;
transform:translateY(-2px);
}

@media(min-width:700px){

.services{
flex-direction:row;
}

.service{
flex:1;
}

}

</style>

</head>

<body>

<div class="container">

<div class="brand">
Fodel India
</div>

<div class="tagline">
Future Oriented Digital Enterprises & Logistics
</div>

<div class="choose">
Choose Your Division
</div>

<div class="services">

<div class="service">

<a href="systems.html" class="btn systems">
📟 Fodel Systems
</a>

<div class="service-text">
Restaurant technology & wireless calling systems
</div>

</div>


<div class="service">

<a href="travel.html" class="btn travel">
✈️ Fodel Travels
</a>

<div class="service-text">
Hotel bookings, group travel & MICE services
</div>

</div>

</div>

</div>

<div class="footer">

<a href="mailto:support@fodel.in">
support@fodel.in
</a>

<a href="tel:+919086399392">
+91 9086399392
</a>

<a href="https://wa.me/9086399392" target="_blank">
WhatsApp
</a>

</div>

<div style="position:absolute;bottom:0;font-size:12px;opacity:0.6;">
© 2015–2026 Fodel India
</div>
