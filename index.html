<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fodel India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#020617;
color:white;
}

/* Brand Header */

.brand{
position:fixed;
top:30px;
width:100%;
text-align:center;
z-index:10;
}

.brand h1{
font-size:34px;
font-weight:600;
}

.brand p{
font-size:13px;
opacity:0.7;
}

/* Layout */

.split-container{
display:flex;
height:100vh;
}

/* Sections */

.panel{
flex:1;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
transition:0.4s;
cursor:pointer;
}

/* Systems Side */

.systems{
background:linear-gradient(135deg,#1e3a8a,#0f172a);
}

.systems:hover{
background:linear-gradient(135deg,#2563eb,#020617);
}

/* Travel Side */

.travel{
background:linear-gradient(135deg,#0f766e,#020617);
}

.travel:hover{
background:linear-gradient(135deg,#14b8a6,#020617);
}

/* Content */

.panel-content h2{
font-size:34px;
margin-bottom:10px;
}

.panel-content p{
opacity:0.85;
font-size:15px;
max-width:320px;
}

/* Mobile */

@media(max-width:800px){

.split-container{
flex-direction:column;
}

.brand{
top:20px;
}

.panel-content h2{
font-size:26px;
}

}

</style>
</head>

<body>

<div class="brand">
<h1>Fodel India</h1>
<p>Future Oriented Digital Enterprises & Logistics</p>
</div>

<div class="split-container">

<a href="systems.html" class="panel systems">

<div class="panel-content">

<h2>Fodel Systems</h2>

<p>
Wireless waiter calling systems designed for restaurants, cafés and lounges.
</p>

</div>

</a>


<a href="travel.html" class="panel travel">

<div class="panel-content">

<h2>Fodel Travels</h2>

<p>
Hotel bookings, group travel, destination weddings and MICE services.
</p>

</div>

</a>

</div>

</body>
</html>
