<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fodel Travels | Hotel Bookings & Group Travel</title>

<meta name="description" content="Fodel Travels offers hotel bookings, destination weddings, group travel and corporate MICE arrangements in Katra Vaishno Devi, Jammu and Kashmir.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
margin:0;
background:#0f172a;
color:white;
}

.banner{
height:60vh;
background:url('travel-banner.jpg') center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.banner h1{
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:8px;
}

.section{
padding:60px 8%;
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
margin-top:40px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:10px;
}

button{
padding:12px 25px;
border:none;
border-radius:6px;
background:white;
color:black;
cursor:pointer;
}

</style>

</head>

<body>

<div class="banner">
<h1>Fodel Travels</h1>
</div>

<section class="section">

<h2>Travel Services</h2>

<div class="cards">

<div class="card">
<h3>Hotel Booking</h3>
<p>Hotel bookings in Katra Vaishno Devi, Jammu and Srinagar.</p>
<button>Room Requirement</button>
</div>

<div class="card">
<h3>Banquet Events</h3>
<p>Wedding venues, banquets and conferences.</p>
<button>Banquet Inquiry</button>
</div>

<div class="card">
<h3>Group Travel</h3>
<p>Group bookings for weddings, pilgrimages and corporate travel.</p>
<button>Group Booking</button>
</div>

</div>

</section>

</body>
</html>
