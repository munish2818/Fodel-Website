<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hospitality Supplies | Fodel India</title>
  <meta name="description" content="Hotel supplies supplier India. Linen, towels, amenities, banquet and restaurant equipment with PAN India dispatch." />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      /* Brand */
      --primary:#c2410c;  /* Hospitality division */
      --navy:#0a1a2b;     /* Reviews button + email */
      --text:#0f172a;
      --muted:#475569;
      --bg:#f8fafc;

      /* UI */
      --radius:14px;
      --shadow:0 10px 24px rgba(0,0,0,0.10);
      --ring:0 0 0 3px rgba(194,65,12,.18);

      /* Layout */
      --container:1200px;
      --topbar:56px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Poppins, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* Sticky top mini-nav (like other pages) */
    .top-nav{
      position:fixed; inset:0 0 auto 0; height:var(--topbar);
      display:flex; justify-content:center; gap:10px; align-items:center;
      background:#fff; border-bottom:1px solid #e5e7eb; z-index:1000;
      padding:8px 12px;
    }
    .top-nav a{
      text-decoration:none; font-weight:700; font-size:14px; color:#fff;
      padding:8px 12px; border-radius:10px; display:inline-flex; align-items:center; gap:8px;
    }
    .top-reviews{ background:var(--navy); }
    .top-home{ background:var(--primary); }

    /* Hero like Travels/Transport (but hospitality orange) */
    .hero{
      margin-top:var(--topbar);
      background: radial-gradient(140% 80% at 20% 20%, #f08a4b 0%, #c2410c 40%, #7a2e0e 100%);
      color:#fff;
      padding:60px 18px 40px;
    }
    .hero .wrap{ max-width:var(--container); margin:0 auto; text-align:center; }
    .brand{ font-size:clamp(26px,5vw,40px); font-weight:700; letter-spacing:-.3px; }
    .tag{ opacity:.92; margin-top:8px; font-weight:600; }

    /* Page body */
    .container{ max-width:var(--container); margin:0 auto; padding:18px; }

    /* Filters (mobile-first) */
    .filters{
      margin:14px 0;
      display:flex; gap:10px; align-items:center; overflow:auto; padding-bottom:4px;
      scrollbar-width:thin;
    }
    .filter{
      flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid #e2e8f0;
      background:#fff; cursor:pointer; font-weight:600; font-size:14px; color:var(--text);
    }
    .filter.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

    /* Grid */
    .grid{
      display:grid; gap:16px;
      grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
      scroll-margin-top:calc(var(--topbar) + 16px);
    }

    /* Cards */
    .card{
      background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
      padding:12px; display:flex; flex-direction:column; gap:10px;
    }
    .thumb{
      width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; background:#f1f5f9; border:1px solid #eef2f7;
    }
    .title{ font-weight:700; font-size:16px; display:flex; justify-content:space-between; gap:8px; }
    .sku{ color:#64748b; font-size:12px; font-weight:600; }
    .desc{ color:var(--muted); font-size:13px; line-height:1.5; }
    .price{ font-weight:700; }

    .btn{
      background:var(--primary); color:#fff; border:none; padding:10px;
      border-radius:10px; font-weight:700; cursor:pointer;
    }
    .btn:hover{ filter:brightness(1.05); }
    .btn:focus{ outline:none; box-shadow:var(--ring); }

    /* Skeleton loaders */
    .skeleton{
      animation:pulse 1.2s ease-in-out infinite;
      background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%); background-size:400% 100%;
      border-radius:10px;
    }
    @keyframes pulse{0%{background-position:100% 50%}100%{background-position:0 50%}}

    /* Footer spacing */
    .spacer{ height:28px; }

    /* Mobile refinements */
    @media(max-width:640px){
      .hero{ padding:44px 14px 28px; }
      .container{ padding:14px; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <nav class="top-nav">
    <a class="top-reviews" href="/reviews.html">⭐ Reviews</a>
    <a class="top-home" href="/">🏠 Home</a>
  </nav>

  <!-- Hero -->
  <section class="hero" aria-label="Page intro">
    <div class="wrap">
      <h1 class="brand">Hospitality Supplies</h1>
      <p class="tag">Linen • Towels • Amenities • Restaurant • Housekeeping • Banquet</p>
    </div>
  </section>

  <!-- Body -->
  <main class="container">
    <!-- Filters -->
    <div class="filters" id="filters" role="tablist" aria-label="Quick filters">
      <button class="filter active" data-cat="all" role="tab" aria-selected="true">All</button>
      <button class="filter" data-cat="linen" role="tab" aria-selected="false">Linen</button>
      <button class="filter" data-cat="towels" role="tab" aria-selected="false">Towels</button>
      <button class="filter" data-cat="amenities" role="tab" aria-selected="false">Amenities</button>
      <button class="filter" data-cat="restaurant" role="tab" aria-selected="false">F&amp;B</button>
      <button class="filter" data-cat="housekeeping" role="tab" aria-selected="false">Housekeeping</button>
      <button class="filter" data-cat="banquet" role="tab" aria-selected="false">Banquet</button>
    </div>

    <!-- Grid -->
    <section id="products" class="grid" aria-live="polite" aria-busy="true"></section>

    <div class="spacer"></div>
  </main>

  <script>
  /***************
   * CONFIG
   ***************/
  // --- Option A: Google Sheets (recommended) ---
  const SHEET_ID   = 'PUT_YOUR_SHEET_ID_HERE';
  const SHEET_NAME = 'Hospitality'; // the visible tab name
  // --- Option B: CSV (fallback; leave empty if using Sheets) ---
  const CSV_URL    = ''; // e.g., '/data/hospitality.csv' or a published CSV url

  // WhatsApp
  const WA_NUMBER = '919797459260';

  // Column names expected in your sheet/CSV:
  const COLS = ['Category','Name','SKU','Price','Image','Description'];

  /***************
   * UTILITIES
   ***************/
  const productsEl = document.getElementById('products');
  const filtersBar = document.getElementById('filters');

  function escapeHtml(str=''){
    return str.replace(/[&<>"'`=\/]/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'
    }[s]));
  }
  const slug = s => (s||'').toString().trim().toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  const safeImg = s => {
    if(!s) return '/images/placeholder.webp';
    const t = s.trim();
    // if full http(s) url
    if(/^https?:\/\//i.test(t)) return t;
    // else relative file name in /images
    return '/images/' + encodeURIComponent(t);
  };

  // Minimal skeleton loader
  function renderSkeleton(count=8){
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb skeleton" style="aspect-ratio:4/3;"></div>
        <div class="skeleton" style="height:16px;width:70%;"></div>
        <div class="skeleton" style="height:12px;width:100%;"></div>
        <div class="skeleton" style="height:12px;width:85%;"></div>
        <div class="skeleton" style="height:16px;width:40%;"></div>
        <div class="skeleton" style="height:38px;width:100%;border-radius:10px;"></div>
      `;
      frag.appendChild(card);
    }
    productsEl.appendChild(frag);
  }

  // Robust CSV parser (handles quotes, commas, newlines)
  function parseCSV(text){
    const rows = [];
    let i = 0, field = '', row = [], inQuotes = false;
    while (i < text.length){
      const char = text[i];
      if (inQuotes){
        if (char === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; } // escaped "
          else inQuotes = false;
        } else {
          field += char;
        }
      } else {
        if (char === '"'){ inQuotes = true; }
        else if (char === ','){ row.push(field); field=''; }
        else if (char === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if (char === '\r'){ /* ignore */ }
        else { field += char; }
      }
      i++;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Build card HTML safely
  function createCard(item){
    const img = safeImg(item.Image);
    const name = escapeHtml(item.Name || '');
    const sku  = escapeHtml(item.SKU || '');
    const price = escapeHtml(item.Price || '');
    const desc  = escapeHtml(item.Description || '');

    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.cat = slug(item.Category);

    const imgEl = document.createElement('img');
    imgEl.className = 'thumb';
    imgEl.loading = 'lazy';
    imgEl.alt = name || 'Product image';
    imgEl.src = img;
    imgEl.onerror = () => { imgEl.src = '/images/placeholder.webp'; };

    const t = document.createElement('div');
    t.className = 'title';
    t.innerHTML = `<span>${name || '—'}</span> ${sku ? `<span class="sku">${sku}</span>` : ''}`;

    const d = document.createElement('p');
    d.className = 'desc';
    d.textContent = desc;

    const p = document.createElement('div');
    p.className = 'price';
    p.textContent = price;

    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = 'Enquire on WhatsApp';
    b.addEventListener('click', () => {
      const msg = `Hospitality enquiry - ${name}${sku ? ` (SKU:${sku})` : ''}`;
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    });

    card.append(imgEl, t, d, p, b);
    return card;
  }

  // Render all
  function renderItems(items){
    productsEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    items.forEach(it => frag.appendChild(createCard(it)));
    productsEl.appendChild(frag);
    productsEl.setAttribute('aria-busy','false');
  }

  // Filtering
  function hookFilters(allItems){
    const buttons = filtersBar.querySelectorAll('.filter');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
        btn.classList.add('active'); btn.setAttribute('aria-selected','true');
        const cat = btn.dataset.cat;
        const list = (cat === 'all') ? allItems : allItems.filter(x => slug(x.Category) === cat);
        renderItems(list);
        // auto scroll to products after filtering
        document.getElementById('products').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  /***************
   * LOADERS
   ***************/
  async function loadFromSheets(){
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const res = await fetch(url, {cache:'no-store'});
    const txt = await res.text();
    const jsonStart = txt.indexOf('{');
    const jsonEnd   = txt.lastIndexOf('}');
    if (jsonStart === -1 || jsonEnd === -1) throw new Error('Bad GViz response');
    const data = JSON.parse(txt.slice(jsonStart, jsonEnd+1));
    const cols = (data.table.cols || []).map(c => (c.label || c.id || '').toString().trim());
    // map columns to indices by label (fallback to default order)
    const idx = {};
    COLS.forEach(name => {
      const i = cols.findIndex(c => c.toLowerCase() === name.toLowerCase());
      idx[name] = i >= 0 ? i : COLS.indexOf(name);
    });
    const rows = (data.table.rows || [])
      .map(r => (r.c || []).map(c => (c && c.v != null) ? String(c.v) : ''))
      .filter(cells => cells.some(v => (v||'').trim().length));
    const items = rows.map(cells => ({
      Category: cells[idx['Category']] || '',
      Name:     cells[idx['Name']] || '',
      SKU:      cells[idx['SKU']] || '',
      Price:    cells[idx['Price']] || '',
      Image:    cells[idx['Image']] || '',
      Description: cells[idx['Description']] || ''
    }));
    return items;
  }

  async function loadFromCSV(){
    const res = await fetch(CSV_URL, {cache:'no-store'});
    const txt = await res.text();
    const rows = parseCSV(txt);
    if (!rows.length) return [];
    const header = rows[0].map(h => (h||'').trim());
    const idx = {};
    COLS.forEach(name => {
      const i = header.findIndex(h => h.toLowerCase() === name.toLowerCase());
      idx[name] = i >= 0 ? i : COLS.indexOf(name);
    });
    return rows.slice(1)
      .filter(r => r && r.some(v => (v||'').trim().length))
      .map(r => ({
        Category:(r[idx['Category']]||'').trim(),
        Name:(r[idx['Name']]||'').trim(),
        SKU:(r[idx['SKU']]||'').trim(),
        Price:(r[idx['Price']]||'').trim(),
        Image:(r[idx['Image']]||'').trim(),
        Description:(r[idx['Description']]||'').trim()
      }));
  }

  async function init(){
    renderSkeleton(8);
    try{
      let items = [];
      if (SHEET_ID && SHEET_NAME){
        items = await loadFromSheets();
      } else if (CSV_URL){
        items = await loadFromCSV();
      } else {
        throw new Error('Please set SHEET_ID & SHEET_NAME or CSV_URL');
      }
      // Defensive: remove empties & normalise categories
      items = items.filter(x => (x.Name||'').trim().length);
      if (!items.length) throw new Error('No rows found. Check share permission or sheet name.');

      renderItems(items);
      hookFilters(items);
    }catch(err){
      console.error(err);
      productsEl.setAttribute('aria-busy','false');
      productsEl.innerHTML = `
        <div class="card">
          <div class="title" style="color:#b91c1c;">Couldn’t load products</div>
          <p class="desc">Please check Google Sheet share settings / sheet name or CSV URL.</p>
          <button class="btn" onclick="location.reload()">Retry</button>
        </div>`;
    }
  }

  init();
  </script>
</body>
</html>
