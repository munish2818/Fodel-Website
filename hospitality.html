<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hospitality Supplies | Fodel India</title>

<meta name="description" content="Hotel supplies supplier India. Linen, towels, amenities, banquet and restaurant equipment with PAN India dispatch.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--primary:#c2410c;
--text:#0f172a;
--muted:#475569;
--bg:#f8fafc;

--radius:14px;
--shadow:0 10px 24px rgba(0,0,0,0.10);

}

*{box-sizing:border-box;margin:0;padding:0}

body{

font-family:Poppins;
background:var(--bg);
color:var(--text);

padding:30px;

display:flex;
justify-content:center;

}

.wrapper{

max-width:1200px;
width:100%;

}

header{

text-align:center;
margin-bottom:40px;

}

h1{

font-size:34px;
margin-bottom:6px;

}

.tagline{

color:var(--muted);

}

.top-nav{

position:fixed;
top:0;
left:0;
width:100%;

background:white;

display:flex;
justify-content:center;

gap:14px;

padding:10px;

border-bottom:1px solid #eee;

}

.top-nav a{

padding:8px 14px;

border-radius:10px;

font-weight:600;

color:white;

text-decoration:none;

}

.top-reviews{

background:#0f172a;

}

.top-home{

background:#c2410c;

}

.filters{

display:flex;
gap:10px;
flex-wrap:wrap;

margin-bottom:20px;

justify-content:center;

}

.filter{

padding:8px 14px;
border-radius:999px;

border:1px solid #ddd;

cursor:pointer;

background:white;

font-size:14px;

}

.filter.active{

background:var(--primary);
color:white;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:18px;

}

.card{

background:white;

border-radius:var(--radius);

box-shadow:var(--shadow);

padding:14px;

display:flex;
flex-direction:column;

}

.card img{

width:100%;
height:170px;

object-fit:cover;

border-radius:10px;

margin-bottom:10px;

}

.title{

font-weight:600;

margin-bottom:6px;

}

.desc{

font-size:13px;

color:var(--muted);

margin-bottom:10px;

}

.price{

font-weight:700;

margin-bottom:10px;

}

.btn{

background:var(--primary);

color:#ffffff;

border:none;

padding:10px;

border-radius:10px;

font-weight:600;

cursor:pointer;

}

.btn:hover{

opacity:.9;

}

@media(max-width:640px){

body{

padding:20px;

}

.card img{

height:140px;

}

}

</style>
</head>

<body>

<nav class="top-nav">
<a class="top-reviews" href="/reviews.html">⭐ Reviews</a>
<a class="top-home" href="/">🏠 Home</a>
</nav>

<div class="wrapper">

<header>

<h1>Hospitality Supplies</h1>

<p class="tagline">

Linen • Towels • Amenities • Restaurant • Housekeeping • Banquet

</p>

</header>

<div class="filters">

<button class="filter active" data-cat="all">All</button>
<button class="filter" data-cat="linen">Linen</button>
<button class="filter" data-cat="towels">Towels</button>
<button class="filter" data-cat="amenities">Amenities</button>
<button class="filter" data-cat="restaurant">F&B</button>
<button class="filter" data-cat="housekeeping">Housekeeping</button>
<button class="filter" data-cat="banquet">Banquet</button>

</div>

<div class="grid" id="products"></div>

</div>

<script>

const sheetURL="PASTE_GOOGLE_SHEET_CSV_LINK";

const grid=document.getElementById("products");

fetch(sheetURL)

.then(res=>res.text())

.then(csv=>{

const rows=csv.split("\n").slice(1);

rows.forEach(r=>{

const c=r.split(",");

const category=c[0];
const name=c[1];
const sku=c[2];
const price=c[3];
const image=c[4];
const desc=c[5];

const card=document.createElement("div");

card.className="card";
card.dataset.cat=category;

card.innerHTML=`

<img src="/images/${image}" loading="lazy">

<div class="title">${name}</div>

<div class="desc">${desc}</div>

<div class="price">${price}</div>

<button class="btn" onclick="enquire('${name}','${sku}')">

Enquire on WhatsApp

</button>

`;

grid.appendChild(card);

});

});

function enquire(name,sku){

const msg=`Hospitality enquiry - ${name} (SKU:${sku})`;

window.open(`https://wa.me/919797459260?text=${encodeURIComponent(msg)}`);

}

const filters=document.querySelectorAll(".filter");

filters.forEach(btn=>{

btn.onclick=()=>{

filters.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

const cat=btn.dataset.cat;

document.querySelectorAll(".card").forEach(card=>{

card.style.display=(cat==="all"||card.dataset.cat===cat)?"":"none";

});

};

});

</script>

</body>
</html>
