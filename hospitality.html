<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hospitality Supplies India | Hotel Linen Towels Amenities | Fodel India</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--primary:#c2410c;
--navy:#0a1a2b;
--bg:#f8fafc;
--text:#0f172a;
--muted:#475569;
--radius:12px;
--shadow:0 8px 20px rgba(0,0,0,.08);
--topbar:60px;
--container:1200px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Poppins,system-ui;
background:var(--bg);
color:var(--text);
}

.top-nav{
position:fixed;
top:0;
left:0;
right:0;
height:var(--topbar);
background:var(--primary);
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 18px;
z-index:1000;
}

.brand-mini{
display:flex;
gap:8px;
align-items:center;
color:#fff;
font-weight:700;
}

.brand-mini .dot{
width:10px;
height:10px;
background:#fff;
border-radius:50%;
}

.chip{
padding:7px 12px;
border-radius:999px;
background:rgba(255,255,255,.15);
color:#fff;
text-decoration:none;
font-weight:600;
font-size:13px;
}

.hero{
margin-top:var(--topbar);
background:var(--primary);
color:#fff;
text-align:center;
padding:45px 20px;
}

.hero h1{
font-size:32px;
}

.container{
max-width:var(--container);
margin:auto;
padding:20px;
}

.searchbox{
background:#fff;
border:1px solid #e2e8f0;
border-radius:999px;
padding:10px 14px;
display:flex;
gap:8px;
margin-bottom:14px;
}

.searchbox input{
border:none;
outline:none;
width:100%;
font:inherit;
}

.tabs{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:12px;
}

.tab{
padding:8px 14px;
border-radius:999px;
border:1px solid #e2e8f0;
background:#fff;
cursor:pointer;
font-weight:600;
white-space:nowrap;
}

.tab.active{
border-color:var(--primary);
}

.tabs-divider{
height:24px;
border-bottom:1px solid #e5e7eb;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr)}
}

.card{
background:#fff;
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:12px;
display:flex;
flex-direction:column;
height:100%;
}

.thumb{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:8px;
background:#f1f5f9;
margin-bottom:8px;
}

.title{
font-weight:700;
font-size:14px;
display:flex;
justify-content:space-between;
}

.sku{
font-size:11px;
color:#64748b;
}

.desc{
font-size:12px;
color:var(--muted);
margin-top:4px;
min-height:48px;
}

.meta{
display:flex;
justify-content:space-between;
font-size:11px;
color:#64748b;
margin-top:4px;
}

.price{
font-weight:700;
margin-top:6px;
}

.card-bottom{
margin-top:auto;
}

.qty{
width:90px;
border:1px solid #e2e8f0;
border-radius:8px;
padding:8px;
text-align:center;
margin-top:6px;
}

.btn{
background:var(--primary);
color:#fff;
border:none;
padding:8px;
border-radius:8px;
font-weight:600;
cursor:pointer;
font-size:13px;
width:100%;
margin-top:8px;
}

.btn.secondary{
background:var(--navy);
}

footer{
margin-top:40px;
padding:28px;
background:#fff;
border-top:1px solid #e5e7eb;
text-align:center;
}

.footer-links{
margin:10px 0;
}

.footer-email{
color:var(--navy);
text-decoration:none;
font-weight:600;
}

.footer-wa{
color:#25D366;
text-decoration:none;
font-weight:600;
}

.copy{
font-size:12px;
color:#94a3b8;
}

</style>
</head>

<body>

<nav class="top-nav">
<div class="brand-mini"><span class="dot"></span>Fodel Hospitality</div>
<a class="chip" href="/">Home</a>
</nav>

<header class="hero">
<h1>India’s Trusted Hospitality Supply Partner</h1>
<p>Hotel Linen • Towels • Amenities • Restaurant Supplies</p>
</header>

<main class="container">

<div class="searchbox">
<input id="search" placeholder="Search products">
</div>

<div class="tabs">
<button class="tab active" data-cat="all">All</button>
<button class="tab" data-cat="linen">Linen</button>
<button class="tab" data-cat="towels">Towels</button>
<button class="tab" data-cat="amenities">Amenities</button>
<button class="tab" data-cat="restaurant">Restaurant</button>
<button class="tab" data-cat="housekeeping">Housekeeping</button>
<button class="tab" data-cat="banquet">Banquet</button>
</div>

<div class="tabs-divider"></div>

<section id="products" class="grid"></section>

</main>

<footer>

<p><strong>Fodel India – Hospitality Supply Specialists</strong></p>
<p>Serving Hotels, Resorts, Hospitals & Institutions since 2015</p>

<div class="footer-links">

<a class="footer-email" href="mailto:sales@fodel.in">sales@fodel.in</a>

<span> • </span>

<a class="footer-wa" href="https://wa.me/919797459260">Talk to Sales</a>

</div>

<div class="copy">© 2015–2026 Fodel India</div>

</footer>

<script>

let products = []

async function loadProducts(){

const res = await fetch('/data/products.json')

products = await res.json()

render(products)

}

function render(list){

const grid = document.getElementById("products")

grid.innerHTML = ""

list.forEach(p=>{

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img class="thumb"
src="/images/${p.img}"
onerror="this.src='/images/no-image.jpg'"
alt="${p.name}">

<div class="title">${p.name}<span class="sku">${p.sku}</span></div>

<div class="desc">${p.desc}</div>

<div class="meta">
<span>${p.moq}</span>
<span>${p.lead}</span>
</div>

<div class="card-bottom">

<div class="price">${p.price}</div>

<input class="qty" type="number" value="1">

<button class="btn">Add to RFQ</button>

<button class="btn secondary">Request Quote</button>

<button class="btn"
onclick="window.open('https://wa.me/919797459260?text=Product enquiry: ${p.name}')">

Enquire on WhatsApp

</button>

</div>
`

grid.appendChild(card)

})

}

document.getElementById("search").addEventListener("input",e=>{

const q=e.target.value.toLowerCase()

render(products.filter(p=>

p.name.toLowerCase().includes(q) ||

p.sku.toLowerCase().includes(q)

))

})

document.querySelectorAll(".tab").forEach(tab=>{

tab.onclick=()=>{

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))

tab.classList.add("active")

const cat=tab.dataset.cat

if(cat==="all")render(products)

else render(products.filter(p=>p.cat===cat))

}

})

loadProducts()

</script>

</body>
</html>
