<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hospitality Supplies India | Hotel Linen Towels Amenities Restaurant Supplies</title>

<meta name="description" content="Hotel supplies supplier India. Linen, towels, amenities, restaurant equipment, housekeeping supplies and banquet products with PAN India dispatch.">

<meta name="keywords" content="hotel supplies india, hospitality supplies india, hotel linen supplier india, hotel towels supplier india, restaurant equipment supplier india, hotel amenities supplier india">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--primary:#c2410c;
--navy:#0a1a2b;
--text:#0f172a;
--muted:#475569;
--bg:#f8fafc;
--radius:12px;
--shadow:0 8px 20px rgba(0,0,0,.08);
}

body{
font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
background:var(--bg);
margin:0;
color:var(--text);
}

.hero{
background:var(--primary);
color:white;
text-align:center;
padding:60px 20px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* search */

.searchbox{
background:white;
border-radius:999px;
padding:10px 15px;
border:1px solid #e2e8f0;
margin-bottom:20px;
}

/* tabs */

.tabs{
display:flex;
gap:8px;
overflow:auto;
position:sticky;
top:0;
background:var(--bg);
padding:10px 0;
z-index:5;
}

.tab{
padding:8px 14px;
border-radius:999px;
border:1px solid #e2e8f0;
background:white;
cursor:pointer;
font-weight:600;
}

.tab.active{
border-color:var(--primary);
}

/* grid */

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

@media(max-width:1024px){
.grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:640px){
.grid{grid-template-columns:repeat(2,1fr)}
}

/* card */

.card{
background:white;
border-radius:12px;
box-shadow:var(--shadow);
padding:12px;
display:flex;
flex-direction:column;
}

.thumb{
aspect-ratio:1/1;
background:#f1f5f9;
border-radius:8px;
margin-bottom:8px;
}

.desc{
font-size:12px;
color:var(--muted);
min-height:32px;
}

.price{
font-weight:700;
margin-top:6px;
}

.qty{
display:flex;
align-items:center;
gap:6px;
margin-top:6px;
}

.qty button{
border:none;
background:#eee;
padding:4px 8px;
cursor:pointer;
}

.select{
margin-top:8px;
}

/* RFQ bar */

.rfq-bar{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
box-shadow:0 -4px 20px rgba(0,0,0,.1);
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.rfq-btn{
background:var(--primary);
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.trust{
text-align:center;
margin-top:40px;
color:var(--muted);
}

</style>
</head>

<body>

<header class="hero">

<h1>Hospitality Supplies</h1>

<p>Hotel Linen • Towels • Amenities • Restaurant • Housekeeping • Banquet</p>

</header>

<main class="container">

<input class="searchbox" id="search" placeholder="Search products">

<div class="tabs">
<button class="tab active" data-cat="all">All</button>
<button class="tab" data-cat="linen">Linen</button>
<button class="tab" data-cat="towels">Towels</button>
<button class="tab" data-cat="amenities">Amenities</button>
<button class="tab" data-cat="restaurant">Restaurant</button>
<button class="tab" data-cat="housekeeping">Housekeeping</button>
<button class="tab" data-cat="banquet">Banquet</button>
</div>

<section id="products" class="grid"></section>

<div class="trust">

Trusted by hotels, resorts, restaurants and banquet halls across India.

<br><br>

<button onclick="window.open('/catalogue.pdf')">

Download Full Product Catalogue

</button>

</div>

</main>

<div class="rfq-bar">

<span id="selected-count">0 items selected</span>

<button class="rfq-btn" onclick="sendRFQ()">

Send RFQ on WhatsApp

</button>

</div>

<script>

const products=[

{cat:"linen",name:"Hotel Bedsheet 300TC",sku:"LINEN300",price:"₹450",desc:"Hotel bedsheet."},

{cat:"towels",name:"Bath Towel 550 GSM",sku:"TWL550",price:"₹220",desc:"Soft bath towel."},

{cat:"amenities",name:"Hotel Shampoo 30ml",sku:"SHAM30",price:"₹12",desc:"Guest room shampoo."},

{cat:"restaurant",name:"Chafing Dish 6L",sku:"CHAF6",price:"₹3200",desc:"Buffet chafing dish."}

]

const grid=document.getElementById("products")

let selected=[]

function render(list){

grid.innerHTML=""

list.forEach((p,i)=>{

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<div class="thumb"></div>

<strong>${p.name}</strong>

<div class="desc">${p.desc}</div>

<div class="price">${p.price}</div>

<div class="qty">

<button onclick="changeQty(${i},-1)">-</button>

<span id="qty${i}">1</span>

<button onclick="changeQty(${i},1)">+</button>

</div>

<label class="select">

<input type="checkbox" onchange="toggleSelect(${i})">

Select

</label>

`

grid.appendChild(card)

})

}

render(products)

let qty={}

function changeQty(i,val){

qty[i]=(qty[i]||1)+val

if(qty[i]<1)qty[i]=1

document.getElementById("qty"+i).innerText=qty[i]

}

function toggleSelect(i){

if(selected.includes(i)){

selected=selected.filter(x=>x!==i)

}else{

selected.push(i)

}

document.getElementById("selected-count").innerText=

selected.length+" items selected"

}

function sendRFQ(){

let msg="Hotel RFQ - Fodel India\n\n"

selected.forEach(i=>{

const p=products[i]

msg+=`${p.name} (SKU:${p.sku}) Qty:${qty[i]||1}\n`

})

window.open("https://wa.me/919797459260?text="+encodeURIComponent(msg))

}

</script>

</body>
</html>
