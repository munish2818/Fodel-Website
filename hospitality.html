<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hospitality Supplies India | Fodel India</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins,Arial;
margin:0;
background:#f8fafc;
color:#0f172a;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr);}
}

.card{
background:#fff;
padding:14px;
border-radius:12px;
box-shadow:0 6px 16px rgba(0,0,0,.08);
display:flex;
flex-direction:column;
}

.thumb{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:8px;
margin-bottom:8px;
}

.title{
font-weight:700;
font-size:14px;
display:flex;
justify-content:space-between;
}

.sku{
font-size:11px;
color:#64748b;
}

.desc{
font-size:12px;
margin-top:4px;
color:#475569;
}

.meta{
font-size:11px;
margin-top:6px;
color:#64748b;
}

.price{
font-weight:700;
margin-top:6px;
}

.qty-row{
display:flex;
gap:8px;
margin-top:8px;
flex-wrap:wrap;
}

.qty{
width:60px;
padding:6px;
border-radius:6px;
border:1px solid #ddd;
}

.btn{
background:#c2410c;
color:white;
border:none;
padding:8px 10px;
border-radius:6px;
cursor:pointer;
font-size:12px;
}

.btn.ghost{
background:white;
color:#0a1a2b;
border:2px solid #0a1a2b;
}

.topbar{
background:#c2410c;
color:white;
padding:14px;
font-weight:700;
}

.sendbar{
margin:16px 0;
}

</style>
</head>

<body>

<div class="topbar">
Fodel Hospitality Supplies
</div>

<div class="container">

<div class="sendbar">
<button class="btn" onclick="sendSelected()">Send Selected Products to WhatsApp</button>
</div>

<div id="products" class="grid"></div>

</div>

<!-- LOAD PRODUCT FILE -->
<script src="/data/products.js"></script>

<script>

const grid = document.getElementById("products")

let selectedProducts=[]

function render(list){

grid.innerHTML=""

list.forEach(p=>{

const card=document.createElement("div")
card.className="card"

card.innerHTML=`

<img class="thumb" src="/images/${p.img}" alt="${p.name}">

<div class="title">
${p.name}
<span class="sku">${p.sku}</span>
</div>

<div class="desc">${p.desc || ""}</div>

<div class="meta">
${p.moq || ""}
</div>

<div class="price">${p.price || ""}</div>

<div class="qty-row">

<input class="qty" type="number" value="1" min="1" id="qty-${p.sku}">

<button class="btn" onclick="addToSelection('${p.sku}')">
Select
</button>

<button class="btn ghost" onclick="sampleOrder('${p.sku}')">
Sample 1pc
</button>

</div>

<button class="btn" onclick="singleWhatsApp('${p.sku}')">
Enquire
</button>

`

grid.appendChild(card)

})

}

render(products)


function addToSelection(sku){

const product=products.find(p=>p.sku===sku)
if(!product) return

const qty=parseInt(document.getElementById("qty-"+sku).value)||1

const existing=selectedProducts.find(p=>p.sku===sku)

if(existing){
existing.qty=qty
}else{
selectedProducts.push({
sku:product.sku,
name:product.name,
qty:qty
})
}

alert(product.name+" added")

}


function sampleOrder(sku){

const product=products.find(p=>p.sku===sku)

const msg=`Sample Order Request
Product: ${product.name}
SKU: ${product.sku}
Quantity: 1 Piece`

window.open(
"https://wa.me/919797459260?text="+encodeURIComponent(msg),
"_blank"
)

}


function singleWhatsApp(sku){

const product=products.find(p=>p.sku===sku)

const qty=parseInt(document.getElementById("qty-"+sku).value)||1

const msg=`Product Enquiry
${product.name}
SKU: ${product.sku}
Quantity: ${qty}`

window.open(
"https://wa.me/919797459260?text="+encodeURIComponent(msg),
"_blank"
)

}


function sendSelected(){

if(selectedProducts.length===0){
alert("Select products first")
return
}

let msg="Hospitality Product Enquiry\n\n"

selectedProducts.forEach(p=>{
msg+=`${p.name} (${p.sku}) - Qty: ${p.qty}\n`
})

window.open(
"https://wa.me/919797459260?text="+encodeURIComponent(msg),
"_blank"
)

}

</script>

</body>
</html>
