<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Hospitality Supplies | Fodel India</title>

<meta name="description" content="Hotel supplies: linen, towels, amenities, housekeeping, banquet & restaurant equipment — PAN India dispatch, fast WhatsApp quotes." />

<link rel="canonical" href="https://www.fodel.in/hospitality.html">

<meta property="og:title" content="Hospitality Supplies | Fodel India">
<meta property="og:description" content="Hotel linen, towels, amenities, housekeeping & banquet supplies across India.">
<meta property="og:image" content="https://www.fodel.in/images/hospitality-og.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{

--primary:#c2410c;
--navy:#0a1a2b;

--text:#0f172a;
--muted:#475569;

--bg:#f8fafc;

--radius:14px;
--shadow:0 10px 24px rgba(0,0,0,0.10);

--container:1200px;
--topbar:60px;

}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.top-nav{

position:fixed;
top:0;
left:0;
right:0;

height:var(--topbar);

background:var(--primary);

display:flex;
align-items:center;
justify-content:space-between;

padding:10px 18px;

z-index:1000;

}

.brand-mini{

display:flex;
align-items:center;

gap:10px;

color:#fff;
font-weight:700;
font-size:15px;

}

.brand-mini .dot{

width:10px;
height:10px;

border-radius:50%;
background:#fff;

}

.top-actions{

display:flex;
gap:10px;
align-items:center;

}

.chip{

text-decoration:none;

font-weight:700;
font-size:14px;

border-radius:999px;

padding:8px 14px;

display:inline-flex;
align-items:center;

gap:6px;

color:#fff;

background:rgba(255,255,255,.14);

border:1px solid rgba(255,255,255,.18);

}

.chip.reviews{
background:var(--navy);
border-color:var(--navy);
}

.chip.home{
background:#00000022;
}

.hero{

margin-top:var(--topbar);

background:var(--primary);

color:#fff;

text-align:center;

padding:50px 20px 70px;

}

.hero .wrap{
max-width:var(--container);
margin:auto;
}

.hero h1{

font-size:clamp(26px,5vw,40px);

}

.hero .tag{

margin-top:8px;

font-weight:600;

}

.container{

max-width:var(--container);

margin:auto;

padding:20px;

}

.tools{

margin-top:18px;

display:grid;

gap:12px;

grid-template-columns:1fr;

}

@media(min-width:860px){

.tools{
grid-template-columns:1fr auto;
align-items:center;
}

}

.searchbox{

display:flex;
gap:10px;
align-items:center;

background:#fff;

border:1px solid #e2e8f0;

border-radius:999px;

padding:10px 14px;

}

.searchbox input{

width:100%;

border:none;
outline:none;

font:inherit;
font-size:16px;

}

.tabs{

display:flex;

gap:10px;

overflow:auto;

padding:8px 4px 14px;

}

.tab{

flex:0 0 auto;

padding:10px 16px;

border-radius:999px;

border:1px solid #e2e8f0;

background:#fff;

cursor:pointer;

font-weight:700;

font-size:14px;

}

.tab.active{

border-color:var(--primary);

box-shadow:0 0 0 4px rgba(194,65,12,.12);

}

.tabs-spacer{

height:26px;

border-bottom:1px solid #e5e7eb;

margin-bottom:14px;

}

.stats{

margin-bottom:12px;

color:#64748b;

font-weight:600;

}

.grid{

display:grid;

gap:18px;

grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

}

.card{

background:#fff;

border-radius:var(--radius);

box-shadow:var(--shadow);

padding:14px;

display:flex;
flex-direction:column;
gap:10px;

}

.thumb{

width:100%;

aspect-ratio:4/3;

object-fit:cover;

border-radius:10px;

background:#f1f5f9;

}

.title{

font-weight:700;

display:flex;
justify-content:space-between;

}

.sku{

font-size:12px;

color:#64748b;

}

.desc{

font-size:13px;

color:var(--muted);

}

.price{

font-weight:700;

}

.btn{

background:var(--primary);

color:#fff;

border:none;

padding:10px;

border-radius:10px;

font-weight:700;

cursor:pointer;

}

footer{

margin-top:40px;

padding:26px 20px;

background:#fff;

border-top:1px solid #e5e7eb;

text-align:center;

}

.footer-links{

display:flex;

gap:14px;

justify-content:center;

flex-wrap:wrap;

font-weight:700;

}

.footer-email{

color:var(--navy);

text-decoration:none;

}

.footer-wa{

color:#25D366;

text-decoration:none;

display:inline-flex;
gap:6px;

}

/* MOBILE HEADER FIX */

@media(max-width:640px){

.top-nav{

padding:10px 14px;

}

.brand-mini{

font-size:14px;

}

.top-actions{

gap:8px;

}

.chip{

font-size:13px;

padding:7px 10px;

}

.tabs{

padding-bottom:18px;

}

.tabs-spacer{

height:32px;

}

}

</style>
</head>

<body>

<nav class="top-nav">

<div class="brand-mini">

<span class="dot"></span>

<span>Fodel Hospitality</span>

</div>

<div class="top-actions">

<a class="chip reviews" href="/reviews.html">⭐ Reviews</a>

<a class="chip home" href="/">🏠 Home</a>

</div>

</nav>

<header class="hero">

<div class="wrap">

<h1>Hospitality Supplies</h1>

<p class="tag">

Linen • Towels • Amenities • Restaurant • Housekeeping • Banquet

</p>

</div>

</header>

<main class="container">

<div class="tools">

<label class="searchbox">

🔎

<input id="search" type="search" placeholder="Search products…" />

</label>

<div id="tabs" class="tabs">

<button class="tab active" data-cat="all">All</button>
<button class="tab" data-cat="linen">Linen</button>
<button class="tab" data-cat="towels">Towels</button>
<button class="tab" data-cat="amenities">Amenities</button>
<button class="tab" data-cat="restaurant">F&B</button>
<button class="tab" data-cat="housekeeping">Housekeeping</button>
<button class="tab" data-cat="banquet">Banquet</button>

</div>

</div>

<div class="tabs-spacer"></div>

<div id="stats" class="stats"></div>

<section id="products" class="grid"></section>

</main>

<footer>

<div class="footer-links">

<a class="footer-email" href="mailto:sales@hs.in">✉️ sales@hs.in</a>

<span>•</span>

<a class="footer-wa" href="https://wa.me/919797459260">WhatsApp</a>

</div>

<div style="margin-top:10px;font-size:12px;color:#94a3b8">

© 2015–2026 Fodel India

</div>

</footer>

<script>

/* PRODUCT DEMO DATA */

const products=[

{Category:"linen",Name:"Hotel Bedsheet 300TC",SKU:"LINEN-300TC",Price:"₹450",Image:"bedsheet.jpg",Description:"Hotel grade cotton bedsheet."},

{Category:"towels",Name:"Bath Towel 550 GSM",SKU:"TWL-550",Price:"₹220",Image:"towel.jpg",Description:"Soft cotton hotel towel."},

{Category:"amenities",Name:"Hotel Shampoo 30ml",SKU:"AM-SHAM",Price:"₹12",Image:"shampoo.jpg",Description:"Guest room shampoo bottle."},

{Category:"restaurant",Name:"Chafing Dish 6L",SKU:"FNB-6L",Price:"₹3200",Image:"chafing.jpg",Description:"Buffet chafing dish."},

{Category:"housekeeping",Name:"Housekeeping Cart",SKU:"HK-CART",Price:"₹7200",Image:"cart.jpg",Description:"Professional housekeeping trolley."},

{Category:"banquet",Name:"Chair Cover",SKU:"BNQ-COVER",Price:"₹120",Image:"chair.jpg",Description:"Stretch banquet chair cover."}

]

const grid=document.getElementById("products")

function render(list){

grid.innerHTML=""

list.forEach(p=>{

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img class="thumb" loading="lazy" width="800" height="600" src="/images/${p.Image}" alt="${p.Name}">

<div class="title">${p.Name}<span class="sku">${p.SKU}</span></div>

<div class="desc">${p.Description}</div>

<div class="price">${p.Price}</div>

<button class="btn" onclick="window.open('https://wa.me/919797459260?text=Hospitality enquiry ${p.Name}')">

Enquire on WhatsApp

</button>

`

grid.appendChild(card)

})

document.getElementById("stats").innerText=list.length+" products"

}

render(products)

</script>

</body>
</html>
